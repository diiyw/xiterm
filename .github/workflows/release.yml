name: Desktop release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build (vMAJOR.MINOR.PATCH); manual builds upload artifacts only'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.event_name }}-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            arch: amd64
            runner: ubuntu-22.04
          - platform: macos
            arch: arm64
            runner: macos-15
          - platform: macos
            arch: amd64
            runner: macos-15-intel
          - platform: windows
            arch: amd64
            runner: windows-2022
    env:
      CGO_ENABLED: '1'
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      DOTNET_ROLL_FORWARD: Major
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'push' && github.ref || inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Validate release version
        id: version
        run: python scripts/package.py --tag "$RELEASE_TAG" --metadata --github-output "$GITHUB_OUTPUT"
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libx11-dev libxext-dev libxrender-dev libxi-dev libwayland-dev libxkbcommon-dev libgl-dev xvfb libgl1-mesa-dri libglx-mesa0
      - name: Install Windows C toolchain
        id: msys2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc
          path-type: inherit
      - name: Configure Windows tools
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          (Join-Path $env:MSYS2_LOCATION 'ucrt64\bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          (Join-Path $env:USERPROFILE '.dotnet\tools') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          'CC=gcc' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          'CXX=g++' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: actions/setup-dotnet@v6.1.0
        if: runner.os == 'Windows'
        with:
          dotnet-version: '8.0.x'
      - name: Install Windows packaging tools
        if: runner.os == 'Windows'
        run: |
          go install github.com/tc-hib/go-winres@v0.3.3
          dotnet tool install --global wix --version 4.0.6
      - name: Download and verify modules
        run: |
          go mod download
          go mod verify
      - name: Test application and assets
        run: |
          go test ./assets ./internal/config ./internal/terminal ./internal/workspace ./internal/app
          go vet ./cmd/xiterm ./assets ./internal/config ./internal/terminal ./internal/workspace ./internal/app
          python -m unittest discover -s scripts -p 'test_*.py'
      - name: Build native installer
        run: python scripts/package.py --tag "$RELEASE_TAG"
      - name: Test packaged Linux executable
        if: runner.os == 'Linux'
        run: |
          python scripts/verify-linux-package.py --version '${{ steps.version.outputs.version }}'
      - name: Test Windows installer install and uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-windows-installer.ps1 -Version '${{ steps.version.outputs.version }}'
      - name: Preserve Windows installer logs on failure
        if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: windows-installer-logs
          path: ${{ runner.temp }}/xiterm-*.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: xiterm-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.dmg
            dist/*.msi
            dist/*.sha256
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish release assets
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: xiterm-*-*
          merge-multiple: true
          path: dist
      - name: Verify checksums and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        working-directory: dist
        shell: bash
        run: |
          sha256sum --check -- *.sha256
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes --title "XiTerm $RELEASE_TAG"
          fi
          gh release upload "$RELEASE_TAG" --clobber -- *.tar.gz *.dmg *.msi *.sha256
