<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>XiTerm</title>
  <defs>
    <linearGradient id="tile" x2="0.8" y2="1">
      <stop stop-color="#244344"/>
      <stop offset=".52" stop-color="#142B30"/>
      <stop offset="1" stop-color="#0B191E"/>
    </linearGradient>
    <linearGradient id="rim" x2=".45" y2="1">
      <stop stop-color="#587475"/>
      <stop offset=".6" stop-color="#233A3E"/>
      <stop offset="1" stop-color="#283B3E"/>
    </linearGradient>
    <linearGradient id="prompt" x2=".65" y2="1">
      <stop stop-color="#F4FFF4"/>
      <stop offset="1" stop-color="#CBEFDF"/>
    </linearGradient>
    <linearGradient id="phosphor" x2=".25" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#A7F4BD"/>
      <stop offset="1" stop-color="#60DFA8"/>
    </linearGradient>
  </defs>
  <rect x="3" y="3" width="506" height="506" rx="112" fill="url(#tile)" stroke="url(#rim)" stroke-width="4"/>
  <!-- The left half of the X doubles as a shell prompt. -->
  <path d="M88 148h78l103 108-103 108H88l103-108z" fill="url(#prompt)"/>
  <!-- The return stroke extends onto the baseline as a terminal cursor. -->
  <path d="M243 206l55-58h78l-94 99z M282 265l51 53h79v46H299l-56-58z" fill="url(#phosphor)"/>
</svg>
